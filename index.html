<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lix</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤍</text></svg>">
<script>
(function(){
  var text = 'Lix';
  var pause = 3200;
  var speed = 220;
  var delSpeed = 160;
  var state = 'typing', idx = 0;
  var cursorVisible = true;

  setInterval(function(){
    cursorVisible = !cursorVisible;
    render();
  }, 530);

  function render(){
    var slice = text.slice(0, idx);
    document.title = slice + (cursorVisible ? '|' : ' ');
  }

  function tick(){
    if(state === 'typing'){
      idx++;
      render();
      if(idx === text.length){ state = 'holding'; setTimeout(tick, pause); return; }
      setTimeout(tick, speed);
    } else if(state === 'holding'){
      state = 'deleting'; setTimeout(tick, delSpeed);
    } else {
      idx--;
      if(idx < 0){ idx = 0; state = 'typing'; setTimeout(tick, 900); return; }
      render();
      setTimeout(tick, delSpeed);
    }
  }

  setTimeout(tick, 800);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bruno+Ace+SC&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

* {
  cursor: none !important;
}

/* ── GLOBAL THEME ENGINE VARIABLES ── */
body {
  /* Default Theme Tokens (Pure White Glows) */
  --base-bg: #000;
  --theme-text-primary: rgba(255, 255, 255, 0.96);
  --theme-text-muted: rgba(255, 255, 255, 0.7);
  --theme-text-deep-muted: rgba(255, 255, 255, 0.35);
  --theme-border: rgba(255, 255, 255, 0.1);
  --theme-bg-glass: rgba(255, 255, 255, 0.03);

  /* Atmospheric Backdrops */
  --theme-bg-gradient: radial-gradient(ellipse 42% 34% at 50% 42%, rgba(255,255,255,0.105), transparent 62%),
                        radial-gradient(ellipse 58% 44% at 50% 58%, rgba(160,180,210,0.055), transparent 72%);
  --theme-tilt-shimmer: radial-gradient(circle at var(--shine-x) var(--shine-y), rgba(255,255,255,0.18), rgba(255,255,255,0.06) 18%, transparent 42%),
                        linear-gradient(115deg, transparent 18%, rgba(255,255,255,0.08) 46%, transparent 68%);

  /* Lighting & Shimmer */
  --text-shadow-glow: rgba(255, 255, 255, 0.62);
  --text-shadow-blur: rgba(255, 255, 255, 0.22);
  --text-shadow-ambient: rgba(255, 255, 255, 0.12);
  --drop-shadow-icon: rgba(255, 255, 255, 0.5);
  --player-aura-1: rgba(255,255,255,0.06);
  --player-aura-2: rgba(210,225,255,0.035);
  --player-aura-3: rgba(255,255,255,0.022);
  --trail-canvas-filter: drop-shadow(0 0 12px rgba(255,255,255,0.45));

  /* Elements */
  --progress-bar-bg: linear-gradient(90deg, rgba(255,255,255,0.58), rgba(255,255,255,0.96));
}

/* ── PURPLE THEME MODES ── */
body.theme-purple {
  --base-bg: #0a0316;
  --theme-text-primary: #f2e7ff;
  --theme-text-muted: #d8bbf7;
  --theme-text-deep-muted: #815baf;
  --theme-border: rgba(186, 104, 200, 0.25);
  --theme-bg-glass: rgba(142, 36, 170, 0.05);

  --theme-bg-gradient: radial-gradient(ellipse 42% 34% at 50% 42%, rgba(186, 104, 200, 0.22), transparent 62%),
                        radial-gradient(ellipse 58% 44% at 50% 58%, rgba(142, 36, 170, 0.14), transparent 72%);
  --theme-tilt-shimmer: radial-gradient(circle at var(--shine-x) var(--shine-y), rgba(224, 64, 251, 0.25), rgba(186, 104, 200, 0.08) 18%, transparent 42%),
                        linear-gradient(115deg, transparent 18%, rgba(224, 64, 251, 0.12) 46%, transparent 68%);

  --text-shadow-glow: rgba(224, 64, 251, 0.85);
  --text-shadow-blur: rgba(186, 104, 200, 0.55);
  --text-shadow-ambient: rgba(142, 36, 170, 0.35);
  --drop-shadow-icon: rgba(224, 64, 251, 0.8);
  --player-aura-1: rgba(224, 64, 251, 0.14);
  --player-aura-2: rgba(142, 36, 170, 0.08);
  --player-aura-3: rgba(186, 104, 200, 0.04);
  --trail-canvas-filter: drop-shadow(0 0 14px rgba(224,64,251,0.65));

  --progress-bar-bg: linear-gradient(90deg, #ba68c8, #e040fb);
}

/* ── RED THEME MODES ── */
body.theme-red {
  --base-bg: #140202;
  --theme-text-primary: #ffebeb;
  --theme-text-muted: #ffb8b8;
  --theme-text-deep-muted: #a63c3c;
  --theme-border: rgba(239, 83, 80, 0.28);
  --theme-bg-glass: rgba(229, 57, 53, 0.05);

  --theme-bg-gradient: radial-gradient(ellipse 42% 34% at 50% 42%, rgba(239, 83, 80, 0.22), transparent 62%),
                        radial-gradient(ellipse 58% 44% at 50% 58%, rgba(229, 57, 53, 0.14), transparent 72%);
  --theme-tilt-shimmer: radial-gradient(circle at var(--shine-x) var(--shine-y), rgba(255, 45, 45, 0.25), rgba(239, 83, 80, 0.08) 18%, transparent 42%),
                        linear-gradient(115deg, transparent 18%, rgba(255, 45, 45, 0.12) 46%, transparent 68%);

  --text-shadow-glow: rgba(255, 23, 68, 0.95);
  --text-shadow-blur: rgba(239, 83, 80, 0.6);
  --text-shadow-ambient: rgba(229, 57, 53, 0.38);
  --drop-shadow-icon: rgba(255, 23, 68, 0.85);
  --player-aura-1: rgba(255, 23, 68, 0.15);
  --player-aura-2: rgba(229, 57, 53, 0.08);
  --player-aura-3: rgba(239, 83, 80, 0.04);
  --trail-canvas-filter: drop-shadow(0 0 14px rgba(255,23,68,0.7));

  --progress-bar-bg: linear-gradient(90deg, #ef5350, #e53935);
}

/* ── APP LAYER HOOKS ── */
#trailCanvas {
  position: fixed; inset: 0; width: 100vw; height: 100vh;
  pointer-events: none; z-index: 100001; opacity: 0.95;
  mix-blend-mode: screen;
  filter: var(--trail-canvas-filter);
  transition: filter 0.3s ease;
}

body {
  width:100vw; height:100vh; overflow:hidden;
  background: var(--base-bg);
  font-family:'DM Sans',sans-serif;
  color: var(--theme-text-primary);
  display:flex; align-items:center; justify-content:center;
  transition: background 0.4s ease;
}

body::before {
  content:''; position:fixed; inset:0; z-index:3; pointer-events:none;
  background: var(--theme-bg-gradient);
  mix-blend-mode:screen; opacity:0.72;
  transition: background 0.4s ease;
}

.bg-video {
  position:fixed; inset:-18px; width:calc(100% + 36px); height:calc(100% + 36px);
  object-fit:cover; z-index:0; opacity:0.46;
  filter:grayscale(0.48) brightness(0.66) contrast(1.08);
  transform:translate3d(var(--bg-x, 0px), var(--bg-y, 0px), 0) scale(1.025);
  will-change:transform, filter;
  transition: filter 0.9s cubic-bezier(0.16,1,0.3,1);
}

.vignette {
  position: fixed; 
  inset: 0; 
  z-index: 1;
  pointer-events: none;
  background: radial-gradient(ellipse 65% 65% at 50% 50%, transparent 0%, rgba(0,0,0,0.52) 58%, rgba(0,0,0,0.96) 100%);
  transition: background 0.8s cubic-bezier(0.16, 1, 0.3, 1), mix-blend-mode 0.8s ease;
}

.grain {
  position:fixed; inset:-50%; z-index:2; width:200%; height:200%; opacity:0.028; pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  animation:grainMove 0.5s steps(1) infinite;
}

@keyframes grainMove {
  0%  { transform:translate(0,0); }
  25% { transform:translate(-3%,-4%); }
  50% { transform:translate(4%,2%); }
  75% { transform:translate(-2%,5%); }
  100%{ transform:translate(3%,-2%); }
}

#tiltWrap {
  position:relative; z-index:10; display:flex; flex-direction:column; align-items:center; isolation:isolate; transform-style:preserve-3d;
  transform:perspective(900px) rotateX(0deg) rotateY(0deg); will-change:transform, filter; padding-bottom:20px;
}

#tiltWrap::before {
  content:''; position:absolute; inset:-70px -120px; z-index:-1; border-radius:42%;
  background: var(--theme-tilt-shimmer);
  opacity:0.28; filter:blur(18px); mix-blend-mode:screen; pointer-events:none;
  transform:translate3d(calc(var(--parallax-x) * -0.35), calc(var(--parallax-y) * -0.35), -70px);
  transition:opacity 0.35s ease, background 0.4s ease;
}

#tiltWrap::after {
  content:''; position:absolute; left:50%; bottom:-34px; width:74%; height:58px; z-index:-2; border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(0,0,0,0.58) 0%, rgba(0,0,0,0.28) 42%, transparent 72%);
  filter:blur(var(--shadow-blur)); opacity:0.72; pointer-events:none;
  transform:translate3d(calc(-50% + var(--shadow-x)), var(--shadow-y), -110px);
}

.avatar-wrap {
  position:relative; margin-bottom:22px; opacity:0; animation:ghostIn 1.5s 0.1s cubic-bezier(0.16,1,0.3,1) forwards;
  --depth-transform:translate3d(calc(var(--parallax-x) * 0.32), calc(var(--parallax-y) * 0.32), 34px);
  transform:var(--depth-transform); transform-style:preserve-3d; will-change:transform;
}

.avatar-wrap::before {
  /* soft radial halo behind avatar */
  content:''; position:absolute; inset:-24px; border-radius:50%;
  background:radial-gradient(circle, var(--text-shadow-blur) 0%, transparent 65%);
  opacity:0.35; animation:haloPulse 4s ease-in-out infinite; pointer-events:none;
  transition: background 0.4s ease;
}

.avatar-wrap::after {
  /* spinning conic arc ring — looks like a gradient progress ring */
  content:''; position:absolute; inset:-6px; border-radius:50%;
  background: conic-gradient(
    var(--text-shadow-glow) 0deg,
    var(--text-shadow-blur) 80deg,
    transparent 160deg,
    transparent 280deg,
    var(--text-shadow-blur) 340deg,
    var(--text-shadow-glow) 360deg
  );
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1.5px), white calc(100% - 1.5px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 1.5px), white calc(100% - 1.5px));
  animation: spinRing 8s linear infinite; pointer-events:none;
  transition: background 0.4s ease;
}

@keyframes haloPulse {
  0%,100% { opacity:0.3; transform:scale(1); }
  50%      { opacity:0.65; transform:scale(1.08); }
}
@keyframes spinRing { to { transform:rotate(360deg); } }

.avatar {
  width:110px; height:110px; border-radius:50%; object-fit:cover; display:block; background:#111;
  border:1.5px solid var(--theme-border);
  box-shadow:0 0 0 5px rgba(0,0,0,0.55), 0 8px 40px rgba(0,0,0,0.8), 0 0 28px var(--text-shadow-ambient);
  filter:brightness(0.95) contrast(1.06); transform:translateZ(18px);
  transition: box-shadow 0.4s ease;
}

.username {
  font-family:'Cormorant Garamond',serif; font-size:62px; font-weight:300; letter-spacing:2px; text-align:center; line-height:1; position:relative; opacity:0;
  animation:ghostIn 1.5s 0.22s cubic-bezier(0.16,1,0.3,1) forwards;
  color: var(--theme-text-primary);
  text-shadow:
    0 0 calc(24px + (var(--text-energy) * 10px)) var(--text-shadow-glow),
    0 0 calc(72px + (var(--text-energy) * 26px)) var(--text-shadow-blur),
    0 0 120px var(--text-shadow-ambient),
    0 2px 20px rgba(0,0,0,0.9);
  --depth-transform:translate3d(calc(var(--parallax-x) * 0.78), calc(var(--parallax-y) * 0.78), 92px) rotateX(var(--inner-tilt-x)) rotateY(var(--inner-tilt-y));
  transform:var(--depth-transform); will-change:transform, text-shadow;
  transition: color 0.3s ease;
}

.username::before {
  content:attr(data-text); position:absolute; inset:0; z-index:-1;
  color: var(--theme-text-deep-muted);
  opacity:calc(var(--text-energy) * 0.34); filter:blur(2.5px); pointer-events:none;
  transform:translate3d(var(--text-ghost-x), var(--text-ghost-y), -10px);
}

.username::after {
  content:attr(data-text); position:absolute; inset:0; color:transparent;
  background:linear-gradient(105deg, transparent 18%, var(--theme-border) 36%, var(--theme-text-primary) 48%, var(--theme-border) 58%, transparent 78%);
  background-size:230% 100%; background-position:calc(var(--shine-x) * 1.4) 50%; -webkit-background-clip:text; background-clip:text;
  opacity:calc(0.3 + (var(--text-energy) * 0.58)); filter:blur(calc(0.2px + (var(--text-energy) * 0.35px))); pointer-events:none; mix-blend-mode:screen;
}

.bio {
  font-size:13px; font-weight:400;
  color: var(--theme-text-muted);
  text-align:center; max-width:320px; line-height:1.75; margin-top:8px; letter-spacing:0.02em; opacity:0;
  animation:ghostIn 1.5s 0.36s cubic-bezier(0.16,1,0.3,1) forwards;
  --depth-transform:translate3d(calc(var(--parallax-x) * 0.32), calc(var(--parallax-y) * 0.32), 34px);
  transform:var(--depth-transform); will-change:transform;
  transition: color 0.3s ease;
  font-style: italic;
}

/* thin divider line between username and bio */
.bio-divider {
  width: 36px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--text-shadow-glow), transparent);
  margin: 10px auto 0;
  opacity: 0;
  animation: ghostIn 1.5s 0.3s cubic-bezier(0.16,1,0.3,1) forwards;
  --depth-transform:translate3d(calc(var(--parallax-x) * 0.32), calc(var(--parallax-y) * 0.32), 34px);
  transform:var(--depth-transform);
  transition: background 0.4s ease;
}

.highlight {
  text-shadow: 0 0 18px var(--text-shadow-glow), 0 0 40px var(--text-shadow-blur), 0 0 80px var(--text-shadow-ambient);
  font-style: normal;
}
.bold-text { font-weight: 600; }

.socials {
  /* now sits inline below the bio inside tiltWrap */
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-top: 18px;
  opacity: 1;
  --depth-transform:translate3d(calc(var(--parallax-x) * 0.22), calc(var(--parallax-y) * 0.22), 22px);
  transform: var(--depth-transform); will-change: transform;
}

.s-btn {
  position: relative; width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; text-decoration: none;
  color: var(--theme-text-muted);
  overflow: visible;
  background: var(--theme-bg-glass);
  backdrop-filter: blur(12px) saturate(150%); -webkit-backdrop-filter: blur(12px) saturate(150%);
  border: 1px solid var(--theme-border);
  box-shadow: 0 2px 12px rgba(0,0,0,0.35);
  transition: transform 0.26s cubic-bezier(0.34,1.56,0.64,1),
              color 0.2s ease, box-shadow 0.22s ease,
              background 0.2s ease, border-color 0.2s ease;
  opacity: 0;
  animation: ghostIn 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
}

/* tooltip label */
.s-btn::after {
  content: attr(title);
  position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(4px);
  font-family: 'DM Sans', sans-serif; font-size: 10px; letter-spacing: 0.06em;
  color: var(--theme-text-muted);
  background: var(--theme-bg-glass);
  backdrop-filter: blur(8px);
  border: 1px solid var(--theme-border);
  border-radius: 6px; padding: 3px 8px;
  white-space: nowrap; pointer-events: none;
  opacity: 0; transition: opacity 0.18s ease, transform 0.18s ease;
}

.s-btn::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--theme-border) 0%, transparent 55%);
  opacity: 0; transition: opacity 0.22s ease; border-radius: inherit;
}

.s-btn:hover {
  transform: translateY(-4px) scale(1.08);
  color: var(--theme-text-primary);
  background: rgba(255,255,255,0.07);
  border-color: var(--text-shadow-glow);
  box-shadow: 0 0 14px var(--text-shadow-ambient), 0 6px 20px rgba(0,0,0,0.45);
}
.s-btn:hover::after  { opacity: 1; transform: translateX(-50%) translateY(0); }
.s-btn:hover::before { opacity: 1; }
.s-btn:active { transform: translateY(-1px) scale(1.03); }

.s-btn svg {
  width: 18px; height: 18px; fill: currentColor; position: relative; z-index: 1;
  filter: drop-shadow(0 0 4px var(--drop-shadow-icon));
}

.views {
  position:fixed; bottom:20px; left:22px; z-index:20;
  display:flex; align-items:center; gap:7px;
  padding: 6px 13px 6px 10px;
  background: var(--theme-bg-glass);
  backdrop-filter: blur(12px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
  border: 1px solid var(--theme-border); border-radius: 999px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  opacity:0; animation:ghostIn 1s 1.4s ease forwards;
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
.views:hover {
  border-color: var(--text-shadow-glow);
  box-shadow: 0 0 10px var(--text-shadow-ambient), 0 2px 14px rgba(0,0,0,0.35);
}
.views svg {
  width:11px; height:11px; fill:currentColor;
  color: var(--theme-text-deep-muted);
  filter: drop-shadow(0 0 4px var(--text-shadow-glow));
  flex-shrink: 0;
}
.views-label {
  font-size:10px; font-weight:400; letter-spacing:0.1em; text-transform: uppercase;
  color: var(--theme-text-deep-muted);
}
#views {
  font-size:11px; font-weight:500; letter-spacing:0.06em;
  color: var(--theme-text-primary);
  text-shadow: 0 0 8px var(--text-shadow-glow);
  font-variant-numeric: tabular-nums;
  transition: color 0.3s ease;
}
.views-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--text-shadow-glow);
  box-shadow: 0 0 6px var(--text-shadow-glow);
  animation: viewsDotPulse 2.4s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes viewsDotPulse {
  0%,100% { opacity: 0.4; transform: scale(0.85); }
  50%      { opacity: 1;   transform: scale(1.15); }
}

/* ── TRACKING FLOATING MUSIC PLAYER OVERRIDES ── */
.player-glow {
  position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(30px); opacity:0; z-index:30; width:380px; max-width:calc(100vw - 32px); border-radius:20px;
  box-shadow: 0 0 18px var(--player-aura-1), 0 0 48px var(--player-aura-2), 0 12px 34px rgba(0,0,0,0.46);
  animation:floatUp 1s 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
  transition: box-shadow 0.3s ease;
}

.player-glow.ready {
  animation:
    floatUp 1s 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards,
    bob 5s 1.8s cubic-bezier(0.45, 0, 0.55, 1) infinite,
    playerAura 4.6s 2s ease-in-out infinite;
}

@keyframes floatUp { to { opacity:1; transform:translateX(-50%) translateY(0); } }
@keyframes bob { 0%,100% { transform:translateX(-50%) translateY(0px); } 50% { transform:translateX(-50%) translateY(-10px); } }

@keyframes playerAura {
  0%,100% { box-shadow: 0 0 18px var(--player-aura-1), 0 0 42px var(--player-aura-2), 0 0 78px var(--player-aura-3), 0 8px 32px rgba(0,0,0,0.4); }
  50% { box-shadow: 0 0 24px var(--text-shadow-glow), 0 0 58px var(--text-shadow-blur), 0 0 104px var(--text-shadow-ambient), 0 10px 36px rgba(0,0,0,0.45); }
}

.music-player {
  width:100%; border-radius:20px; padding:14px 16px 14px;
  background: var(--theme-bg-glass);
  backdrop-filter: blur(25px) saturate(140%); -webkit-backdrop-filter: blur(25px) saturate(140%);
  border: 1px solid var(--theme-border); overflow:hidden; position:relative;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), inset 0 -1px 0 rgba(0,0,0,0.2);
}

.music-player::before {
  content:''; position:absolute; top:0; left:8%; right:8%; height:1px;
  background:linear-gradient(90deg, transparent, var(--theme-border), transparent); border-radius:50%;
}
.music-player::after {
  content:''; position:absolute; inset:0;
  background:radial-gradient(circle at 28% 0%, var(--theme-border), transparent 38%);
  opacity:0.8; pointer-events:none;
}

.player-top { display:flex; align-items:center; gap:13px; }
.cover-wrap { position:relative; flex-shrink:0; width:52px; height:52px; }
.player-cover { width:52px; height:52px; border-radius:9px; object-fit:cover; display:block; background:#1a1a1a; box-shadow:0 3px 16px rgba(0,0,0,0.55); transition:opacity 0.3s ease; }
.player-meta { flex:1; min-width:0; }

.player-title {
  font-size:14px; font-weight:500; letter-spacing:0.03em;
  color: var(--theme-text-primary);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:2px;
  filter: drop-shadow(0 0 6px var(--text-shadow-glow));
}

.player-artist {
  font-size:11px; font-weight:300;
  color: var(--theme-text-deep-muted);
  letter-spacing:0.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

.player-ctrls { display:flex; align-items:center; gap:2px; flex-shrink:0; }

.ctrl:hover { color: var(--theme-text-primary); background: var(--theme-bg-glass); transform:scale(1.1); }
.ctrl.play {

.p-track { flex:1; height:2px; background: var(--theme-border); border-radius:2px; cursor:pointer; position:relative; transition:height 0.15s; }
.p-track:hover { height:4px; }

.p-fill {
  position:absolute; left:0; top:0; height:100%;
  background: var(--progress-bar-bg);
  border-radius:2px; width:0%;

  pointer-events:none; transition:width 0.3s linear;
}
.p-fill::after { content:''; position:absolute; right:-5px; top:50%; transform:translateY(-50%) scale(0); width:9px; height:9px; background:#fff; border-radius:50%; box-shadow:0 0 8px #fff; transition:transform 0.15s; }
.p-track:hover .p-fill::after { transform:translateY(-50%) scale(1); }

@keyframes ghostIn {
  from { opacity:0; transform:translateY(24px) var(--depth-transform, translateZ(0)); filter:blur(7px); }

/* Click to Continue Overlay */

}

#overlay-name {

#overlay-text {

/* subtle blink on the hint */

  animation: blinkCaret 1.1s step-end infinite;
  color: rgba(255,255,255,0.5);

}
@keyframes blinkCaret { 0%,100%{opacity:1} 50%{opacity:0} }

/* ── FOOLPROOF HIGH-VISIBILITY TEXT ANIMATIONS ── */

/* ── UPGRADED THREE-CHANNEL GLITCH (PURPLE) ── */
body.theme-purple .username {
  color: #ffffff !important;
  opacity: 1 !important;
  visibility: visible !important;
  /* Reduced loop duration to exactly 3 seconds */
  animation: purpleRGBGlitch 3s infinite !important;
}

@keyframes purpleRGBGlitch {
  /* Stable neon hum for 90% of the loop cycle */
  0%, 90%, 97%, 100% {
    text-shadow: 0 0 8px rgba(224, 64, 251, 0.8), 0 0 16px rgba(224, 64, 251, 0.4);
  }
  /* Split-second Frame 1: Sharp multi-directional RGB color separation */
  92% {
    /* Red channel pushes left (-), Cyan pushes right (+), Purple covers the core glow */
    text-shadow: 
      -4px -1px 0 #ff1744, 
       4px  1px 0 #00e5ff, 
       0    0  15px #e040fb;
  }
  /* Split-second Frame 2: Vertical/Horizontal jitter shift */
  94% {
    text-shadow: 
       3px  2px 0 #ff1744, 
      -3px -2px 0 #00e5ff, 
       0    0  20px #e040fb;
  }
}


/* ── RED THEME: INTENSE DOWNWARD LIQUID GRADIENT SHADOW ── */
body.theme-red .username {

  opacity: 1 !important;

  animation: bloodDripShadow 5s ease-in-out infinite alternate !important;
}

@keyframes bloodDripShadow {
  0% {
    /* Tight, sharp crimson outline */
    text-shadow: 
      0 1px 2px rgba(139, 0, 0, 0.9),
      0 2px 4px rgba(100, 0, 0, 0.8);
  }
  100% {
    /* The shadow heavily elongates strictly downward on the Y-axis */
    /* This creates the bleeding trail illusion without changing the element height */
    text-shadow: 
      0 4px 4px rgba(255, 0, 0, 0.8),
      0 12px 10px rgba(139, 0, 0, 0.9),
      0 22px 18px rgba(70, 0, 5, 0.95),
      0 32px 30px rgba(0, 0, 0, 0.9);
  }
}

/* ── AUTHENTIC LIGHT BULB FLICKER ── */
body:not(.theme-purple):not(.theme-red) .username {
  color: #ffffff !important;
  /* Base glow */
  text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #fff !important;
  
  /* A slightly longer duration for the main cycle */
  animation: bulbFlicker 3s infinite linear;
}

@keyframes bulbFlicker {
  0%, 100% { opacity: 1; text-shadow: 0 0 5px #fff, 0 0 10px #fff; }
  
  /* The 'micro-flicker' burst (rapid stutters) */
  5% { opacity: 0.5; text-shadow: none; }
  10% { opacity: 0.9; text-shadow: 0 0 5px #fff; }
  15% { opacity: 0.4; text-shadow: none; }
  20% { opacity: 1; text-shadow: 0 0 8px #fff, 0 0 20px #fff; }
  
  /* Long period of steady light */
  50% { opacity: 1; text-shadow: 0 0 5px #fff, 0 0 10px #fff; }
  
  /* A single, sharp 'dying' flicker */
  60% { opacity: 0.2; text-shadow: none; }
  65% { opacity: 1; text-shadow: 0 0 5px #fff, 0 0 15px #fff; }
  
  /* Another quick pulse */
  85% { opacity: 0.7; text-shadow: 0 0 2px #fff; }
  90% { opacity: 1; text-shadow: 0 0 5px #fff; }
}

<script>
const wrap = document.getElementById('tiltWrap');
const bgVideo = document.querySelector('.bg-video');
let winCX=window.innerWidth/2, winCY=window.innerHeight/2;
const tilt = {
  targetX:0, targetY:0,
  currentX:0, currentY:0,
  velocityX:0, velocityY:0,
  targetScale:1, currentScale:1, velocityScale:0,
  textEnergy:0,
  parallaxX:0, parallaxY:0,
  shineX:50, shineY:50,
  raf:null
};

window.addEventListener('resize',()=>{
  winCX=window.innerWidth/2;
  winCY=window.innerHeight/2;
});

function setTiltTarget(e){
  const x=(e.clientX-winCX)/winCX;
  const y=(e.clientY-winCY)/winCY;
  tilt.targetX=Math.max(-1,Math.min(1,y))*-10;
  tilt.targetY=Math.max(-1,Math.min(1,x))*12;
  tilt.parallaxX=Math.max(-1,Math.min(1,x))*18;
  tilt.parallaxY=Math.max(-1,Math.min(1,y))*14;
  tilt.shineX=50+(Math.max(-1,Math.min(1,x))*32);
  tilt.shineY=50+(Math.max(-1,Math.min(1,y))*28);
  tilt.targetScale=1.025;
  if(!tilt.raf) tilt.raf=requestAnimationFrame(tickTilt);
}

document.addEventListener('mousemove',setTiltTarget);
document.addEventListener('mouseleave',()=>{
  tilt.targetX=0;
  tilt.targetY=0;
  tilt.parallaxX=0;
  tilt.parallaxY=0;
  tilt.shineX=50;
  tilt.shineY=50;
  tilt.targetScale=1;
  if(!tilt.raf) tilt.raf=requestAnimationFrame(tickTilt);
});

function tickTilt(){
  const stiffness=0.085;
  const damping=0.78;

  tilt.velocityX=(tilt.velocityX+(tilt.targetX-tilt.currentX)*stiffness)*damping;
  tilt.velocityY=(tilt.velocityY+(tilt.targetY-tilt.currentY)*stiffness)*damping;
  tilt.velocityScale=(tilt.velocityScale+(tilt.targetScale-tilt.currentScale)*0.075)*0.8;
  tilt.currentX+=tilt.velocityX;
  tilt.currentY+=tilt.velocityY;
  tilt.currentScale+=tilt.velocityScale;

  const driftX=tilt.parallaxX+(tilt.currentY*0.28);
  const driftY=tilt.parallaxY-(tilt.currentX*0.22);
  const shadowX=(-tilt.currentY*2.15).toFixed(2);
  const shadowY=(26+(Math.abs(tilt.currentX)+Math.abs(tilt.currentY))*0.55).toFixed(2);
  const shadowBlur=(46+(Math.abs(tilt.currentX)+Math.abs(tilt.currentY))*1.15).toFixed(2);
  const innerTiltX=(tilt.currentX*0.11).toFixed(3);
  const innerTiltY=(tilt.currentY*0.12).toFixed(3);
  const movement=Math.min(1,(Math.abs(tilt.velocityX)+Math.abs(tilt.velocityY))*0.18+(Math.abs(tilt.targetX-tilt.currentX)+Math.abs(tilt.targetY-tilt.currentY))*0.035);
  tilt.textEnergy+=(movement-tilt.textEnergy)*0.16;
  const ghostX=(-tilt.currentY*0.13*tilt.textEnergy).toFixed(2);
  const ghostY=(tilt.currentX*0.1*tilt.textEnergy).toFixed(2);
  const textRoll=(tilt.currentX*0.42+tilt.velocityY*1.6)*tilt.textEnergy;
  const textSkew=(tilt.currentY*0.035+tilt.velocityY*0.18)*tilt.textEnergy;

  wrap.style.transform=`perspective(900px) rotateX(${tilt.currentX.toFixed(3)}deg) rotateY(${tilt.currentY.toFixed(3)}deg) scale(${tilt.currentScale.toFixed(4)})`;
  wrap.style.setProperty('--parallax-x',`${driftX.toFixed(2)}px`);
  wrap.style.setProperty('--parallax-y',`${driftY.toFixed(2)}px`);
  wrap.style.setProperty('--shine-x',`${tilt.shineX.toFixed(2)}%`);
  wrap.style.setProperty('--shine-y',`${tilt.shineY.toFixed(2)}%`);
  wrap.style.setProperty('--shadow-x',`${shadowX}px`);
  wrap.style.setProperty('--shadow-y',`${shadowY}px`);
  wrap.style.setProperty('--shadow-blur',`${shadowBlur}px`);
  wrap.style.setProperty('--inner-tilt-x',`${innerTiltX}deg`);
  wrap.style.setProperty('--inner-tilt-y',`${innerTiltY}deg`);
  wrap.style.setProperty('--text-energy',tilt.textEnergy.toFixed(3));
  wrap.style.setProperty('--text-ghost-x',`${ghostX}px`);
  wrap.style.setProperty('--text-ghost-y',`${ghostY}px`);
  wrap.style.setProperty('--text-roll',`${textRoll.toFixed(2)}px`);
  wrap.style.setProperty('--text-skew',`${textSkew.toFixed(3)}deg`);
  if(bgVideo){
    bgVideo.style.setProperty('--bg-x',`${(-driftX*0.18).toFixed(2)}px`);
    bgVideo.style.setProperty('--bg-y',`${(-driftY*0.18).toFixed(2)}px`);
  }

  const settled =
    Math.abs(tilt.targetX-tilt.currentX)<0.01 &&
    Math.abs(tilt.targetY-tilt.currentY)<0.01 &&
    Math.abs(tilt.velocityX)<0.01 &&
    Math.abs(tilt.velocityY)<0.01 &&
    Math.abs(tilt.targetScale-tilt.currentScale)<0.001 &&
    Math.abs(tilt.velocityScale)<0.001;

  if(settled){
    tilt.currentX=tilt.targetX;
    tilt.currentY=tilt.targetY;
    tilt.currentScale=tilt.targetScale;
    wrap.style.transform=`perspective(900px) rotateX(${tilt.currentX.toFixed(3)}deg) rotateY(${tilt.currentY.toFixed(3)}deg) scale(${tilt.currentScale.toFixed(4)})`;
    wrap.style.setProperty('--inner-tilt-x',`${(tilt.currentX*0.11).toFixed(3)}deg`);
    wrap.style.setProperty('--inner-tilt-y',`${(tilt.currentY*0.12).toFixed(3)}deg`);
    tilt.textEnergy=0;
    wrap.style.setProperty('--text-energy','0');
    wrap.style.setProperty('--text-ghost-x','0px');
    wrap.style.setProperty('--text-ghost-y','0px');
    wrap.style.setProperty('--text-roll','0px');
    wrap.style.setProperty('--text-skew','0deg');
    if(bgVideo){
      bgVideo.style.setProperty('--bg-x',`${(-tilt.parallaxX*0.18).toFixed(2)}px`);
      bgVideo.style.setProperty('--bg-y',`${(-tilt.parallaxY*0.18).toFixed(2)}px`);
    }
    tilt.raf=null;
  } else {
    tilt.raf=requestAnimationFrame(tickTilt);
  }
}

let idx=0,playing=false;
const audio=document.getElementById('audio');
const coverEl=document.getElementById('cover');
const nameEl=document.getElementById('trackName');
const artistEl=document.getElementById('trackArtist');
const elEl=document.getElementById('elapsed');
const durEl=document.getElementById('dur');
const fillEl=document.getElementById('pFill');
const trackEl=document.getElementById('pTrack');
const playBtn=document.getElementById('playBtn');
const playIcon=document.getElementById('playIcon');
const playerGlow=document.getElementById('playerGlow');

const PLAY='M8 5v14l11-7z';
const PAUSE='M8 19c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2s-2 .9-2 2v10c0 1.1.9 2 2 2m6-12v10c0 1.1.9 2 2 2s2-.9 2-2V7c0-1.1-.9-2-2-2s-2 .9-2 2';
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

function load(i,autoplay){
  const t=tracks[i];
  audio.src=t.src;
  nameEl.textContent=t.title;
  artistEl.textContent=t.artist;
  coverEl.style.opacity='0';
  setTimeout(()=>{coverEl.src=t.cover;coverEl.style.opacity='1';},150);
  fillEl.style.width='0%';
  elEl.textContent='0:00';
  durEl.textContent='0:00';
  if(autoplay) audio.play().catch(()=>{});
}

function setIcon(p){playIcon.innerHTML=`<path d="${p?PAUSE:PLAY}"/>`;}

playBtn.onclick=()=>{
  playing?audio.pause():audio.play().catch(()=>{});
  playing=!playing;setIcon(playing);
};
document.getElementById('nextBtn').onclick=()=>{idx=(idx+1)%tracks.length;load(idx,playing);};
document.getElementById('prevBtn').onclick=()=>{
  if(audio.currentTime>3){audio.currentTime=0;return;}
  idx=(idx-1+tracks.length)%tracks.length;load(idx,playing);
};
audio.addEventListener('play',()=>{playing=true;setIcon(true);});
audio.addEventListener('pause',()=>{playing=false;setIcon(false);});
audio.addEventListener('timeupdate',()=>{
  if(!audio.duration) return;
  fillEl.style.width=(audio.currentTime/audio.duration*100)+'%';
  elEl.textContent=fmt(audio.currentTime);
  durEl.textContent=fmt(audio.duration);
});
audio.addEventListener('ended',()=>{idx=(idx+1)%tracks.length;load(idx,true);});
trackEl.addEventListener('click',e=>{
  if(!audio.duration) return;
  const r=trackEl.getBoundingClientRect();
  audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
});

// Pick a random track and load it silently — no autoplay yet
const randomIndex = Math.floor(Math.random() * tracks.length);
load(randomIndex, false);
setTimeout(()=>{playerGlow.classList.add('ready');},1800);

// Overlay click: hide overlay then start playback
const overlay = document.getElementById('overlay');
overlay.addEventListener('click', () => {
  overlay.classList.add('hidden');
  if (!playing) {
    audio.play().then(() => {
      playing = true;

    }).catch(() => {});
  }

const canvas = document.getElementById('trailCanvas');
const ctx = canvas.getContext('2d');
let dpr = Math.min(window.devicePixelRatio || 1, 2);

// ── Cursor state ──
let mouse  = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
let tip    = { x: mouse.x, y: mouse.y };   // snappy inner dot
let lag    = { x: mouse.x, y: mouse.y };   // lazier trailing point
let cursorVisible = false;
let cursorPulse   = 0;

// Ribbon: ring buffer of positions for the smooth comet tail
const TRAIL_LEN = 42;
const trail = Array.from({ length: TRAIL_LEN }, () => ({ x: mouse.x, y: mouse.y }));
let trailHead = 0;

// ── Theme colour resolver ──
function getCursorColor() {
  const body = document.body;
  if (body.classList.contains('theme-purple')) return { r:200, g:80,  b:255 };
  if (body.classList.contains('theme-red'))    return { r:255, g:40,  b:60  };
  return { r:255, g:255, b:255 };
}

function sizeCursorCanvas(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(window.innerWidth  * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  canvas.style.width  = window.innerWidth  + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeCursorCanvas();
window.addEventListener('resize', sizeCursorCanvas);

document.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  cursorVisible = true;
});
document.addEventListener('mouseleave', () => { cursorVisible = false; });
document.addEventListener('mouseenter', () => { cursorVisible = true;  });

function animateCursor() {
  // Tip snaps quickly, lag drifts slowly — creates stretch feel
  tip.x += (mouse.x - tip.x) * 0.28;
  tip.y += (mouse.y - tip.y) * 0.28;
  lag.x += (mouse.x - lag.x) * 0.08;
  lag.y += (mouse.y - lag.y) * 0.08;

  cursorPulse += 0.06;

  // Push tip into ring buffer
  trail[trailHead] = { x: tip.x, y: tip.y };
  trailHead = (trailHead + 1) % TRAIL_LEN;

  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  ctx.globalCompositeOperation = 'lighter';

  if (cursorVisible) {
    const { r, g, b } = getCursorColor();

    // ── 1. Ribbon tail ──
    // Walk the ring buffer oldest→newest, drawing tapered line segments
    ctx.lineCap  = 'round';
    ctx.lineJoin = 'round';

    for (let i = 1; i < TRAIL_LEN; i++) {
      const idxA = (trailHead + i - 1) % TRAIL_LEN;
      const idxB = (trailHead + i)     % TRAIL_LEN;
      const ax = trail[idxA].x, ay = trail[idxA].y;
      const bx = trail[idxB].x, by = trail[idxB].y;

      // t goes 0 (oldest/tail) → 1 (newest/head)
      const t = i / TRAIL_LEN;
      const alpha = t * t * 0.55;          // quadratic fade: nearly invisible at tail
      const width = 1 + t * t * 4.5;      // taper: thin at tail, thicker at head

      ctx.beginPath();
      ctx.lineWidth   = width;
      ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.stroke();
    }

    // ── 2. Soft aura around the head ──
    const aura = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, 22);
    aura.addColorStop(0,   `rgba(${r},${g},${b},0.18)`);
    aura.addColorStop(0.4, `rgba(${r},${g},${b},0.06)`);
    aura.addColorStop(1,   `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, 22, 0, Math.PI * 2);
    ctx.fill();

    // ── 3. Outer ring — orbits slightly behind the tip (uses lag) ──
    const pulse = Math.sin(cursorPulse) * 0.5 + 0.5;
    const ringR = 11 + pulse * 2.5;
    ctx.beginPath();
    ctx.arc(lag.x, lag.y, ringR, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${r},${g},${b},${0.28 + pulse * 0.14})`;
    ctx.lineWidth = 1;
    ctx.stroke();

    // ── 4. Sharp centre dot ──
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, 2.2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},0.95)`;
    ctx.fill();
  }

  requestAnimationFrame(animateCursor);
}

animateCursor();

document.addEventListener("DOMContentLoaded", () => {
  const themeBtn = document.getElementById("themeBtn");
  const themeText = document.getElementById("themeText");

  const themes = [
    { name: "Default", class: "" },
    { name: "Purple", class: "theme-purple" },
    { name: "Red", class: "theme-red" }
  ];
  
  let currentThemeIndex = 0;

  if (themeBtn) {
    themeBtn.addEventListener("click", (e) => {
      e.stopPropagation(); 
      
      if (themes[currentThemeIndex].class) {
        document.body.classList.remove(themes[currentThemeIndex].class);
      }

      currentThemeIndex = (currentThemeIndex + 1) % themes.length;

      if (themes[currentThemeIndex].class) {
        document.body.classList.add(themes[currentThemeIndex].class);
      }

      themeText.textContent = `Theme: ${themes[currentThemeIndex].name}`;
    });
  }

  // ── VOLUME CONTROLLER ──
  const volLabel    = document.getElementById('volLabel');
  const volIconBtn  = document.getElementById('volIconBtn');
  const volIconHigh = document.getElementById('volIconHigh');
  const volIconLow  = document.getElementById('volIconLow');
  const volIconMute = document.getElementById('volIconMute');
  const volFill     = document.getElementById('volFill');
  const volThumb    = document.getElementById('volThumb');
  const volWrap     = document.getElementById('volSliderWrap');
  const audioEl     = document.getElementById('audio');

  let lastVol = 80;
  let dragging = false;

  function setVolIcon(v) {
    volIconHigh.style.display = v > 40 ? 'block' : 'none';
    volIconLow.style.display  = (v > 0 && v <= 40) ? 'block' : 'none';
    volIconMute.style.display = v === 0 ? 'block' : 'none';
  }

  function applyVolume(v) {
    const pct = Math.round(Math.max(0, Math.min(100, v)));
    const pctStr = pct + '%';
    // drive both fill bar and thumb via the same CSS custom property
    volFill.style.setProperty('--vol-pct', pctStr);
    volFill.style.width = pctStr;
    volThumb.style.left = pctStr;
    volLabel.textContent = pctStr;
    volWrap.setAttribute('aria-valuenow', pct);
    if (audioEl) audioEl.volume = pct / 100;
    setVolIcon(pct);
  }

  function volFromPointer(e) {
    const r = volWrap.getBoundingClientRect();
    const raw = (e.clientX - r.left) / r.width * 100;
    return Math.round(Math.max(0, Math.min(100, raw)));
  }

  volWrap.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    dragging = true;
    const v = volFromPointer(e);
    if (v > 0) lastVol = v;
    applyVolume(v);
  });

  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const v = volFromPointer(e);
    if (v > 0) lastVol = v;
    applyVolume(v);
  });

  window.addEventListener('mouseup', () => { dragging = false; });

  volIconBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const cur = parseInt(volLabel.textContent, 10);
    if (cur === 0) {
      applyVolume(lastVol || 80);
    } else {
      lastVol = cur;
      applyVolume(0);
    }
  });

  if (audioEl) audioEl.volume = 0.8;
  applyVolume(80);
});

// ── View counter via Abacus API ─────────────────────────────────────────────
// Loaded as a plain <script> tag with a JSONP callback — no fetch(), no CORS
// issues, not blocked by ad blockers. Auto-creates the counter on first visit.
function _vc(r) {
  var el = document.getElementById('views');
  if (!el || !r || r.value == null) return;
  var target = parseInt(r.value, 10);
  if (isNaN(target)) { el.textContent = r.value; return; }
  // count-up animation over ~1.2s
  var start = 0;
  var duration = 1200;
  var startTime = null;
  function step(ts) {
    if (!startTime) startTime = ts;
    var progress = Math.min((ts - startTime) / duration, 1);
    // ease-out cubic
    var eased = 1 - Math.pow(1 - progress, 3);
    el.textContent = Math.floor(eased * target).toLocaleString();
    if (progress < 1) requestAnimationFrame(step);
    else el.textContent = target.toLocaleString();
  }
  requestAnimationFrame(step);
}
</script>
<script async src="https://abacus.jasoncameron.dev/hit/lixjinx.github.io/visits-v3?callback=_vc"></script>
